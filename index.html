<style>
/* Layout: a lab bench. Plot on the left, controls and findings on the right; stacks on phones. */
:root {
  --bg: #F3F1EC; --panel: #FFFFFF; --ink: #1C2433; --muted: #5B6475; --rule: #D8D4CB;
  --accent: #1F3A5F; --ok: #23665A; --warn: #A12F24; --stage: #FBFAF7; --grid: #E6E2D9;
  --na: #B85A0E; --k: #6A3D9A; --trace: #1F3A5F; --ghost: #9AA6B8; --stim: #23665A;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161E; --panel: #1A202B; --ink: #E8EAF0; --muted: #A3ABBA; --rule: #2E3646;
    --accent: #9DB7DD; --ok: #6FC3AE; --warn: #F08A7E; --stage: #161B24; --grid: #273041;
    --na: #F2994A; --k: #B79CE8; --trace: #E8EAF0; --ghost: #5D6A80; --stim: #6FC3AE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161E; --panel: #1A202B; --ink: #E8EAF0; --muted: #A3ABBA; --rule: #2E3646;
  --accent: #9DB7DD; --ok: #6FC3AE; --warn: #F08A7E; --stage: #161B24; --grid: #273041;
  --na: #F2994A; --k: #B79CE8; --trace: #E8EAF0; --ghost: #5D6A80; --stim: #6FC3AE;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
.app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.topbar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; border-bottom: 2px solid var(--rule); padding-block: 4px 8px; }
.topbar h1 { font-size: 1.05rem; margin: 0; color: var(--accent); letter-spacing: 0.02em; }
.topbar .note { font-size: 0.85rem; color: var(--muted); }
#jspsych-target { min-height: 70vh; display: flex; flex-direction: column; }

/* jsPsych essentials (inlined) */
.jspsych-display-element { display: flex; flex-direction: column; font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
.jspsych-display-element:focus { outline: none; }
.jspsych-content-wrapper { display: flex; align-items: flex-start; margin: 0 auto; flex: 1 1 100%; width: 100%; }
.jspsych-content { max-width: 100%; width: 100%; text-align: left; margin: 0 auto !important; }
.jspsych-btn, .btn {
  display: inline-block; font: 700 1rem var(--font-body); cursor: pointer;
  padding: 12px 24px; border-radius: 10px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--bg); touch-action: manipulation;
}
.btn2 { font: 700 0.95rem var(--font-body); padding: 9px 16px; border-radius: 10px; border: 2px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.jspsych-btn:focus-visible, .btn:focus-visible, .btn2:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--na); outline-offset: 2px; }
.jspsych-html-button-response-btngroup { display: flex; justify-content: center; margin-top: 16px; }

/* reading column */
.read { max-width: 42rem; margin: 8px auto; display: flex; flex-direction: column; gap: 12px; }
.read h2 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.read p { margin: 0; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.calm { background: var(--panel); border-left: 4px solid var(--ok); padding: 10px 14px; border-radius: 6px; }
.partlist { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 4px; }

/* lab bench */
.bench-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.bench-head h2 { margin: 0; font-size: 1.45rem; line-height: 1.2; }
.glance { background: var(--panel); border-left: 4px solid var(--na); padding: 8px 12px; border-radius: 6px; font-weight: 700; color: var(--accent); }
.bench { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.card h3 { margin: 0 0 8px; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.plotwrap { position: relative; width: 100%; }
canvas { display: block; width: 100%; background: var(--stage); border-radius: 8px; }
.readout { margin-top: 8px; font-size: 1.05rem; font-weight: 700; min-height: 1.6em; }
.readout .num { font-family: var(--font-num); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
.sw { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.ctrl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.ctrl label { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.ctrl .val { font-family: var(--font-num); font-weight: 600; color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-weight: 700; }
.toggle input { width: 22px; height: 22px; accent-color: var(--warn); }
.toggle small { font-weight: 400; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.steps { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 3px; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.field label { font-size: 0.95rem; }
.field .inrow { display: flex; gap: 8px; align-items: center; }
.field input { font: 600 1rem var(--font-num); width: 6.5rem; padding: 6px 8px; border-radius: 8px; border: 2px solid var(--rule); background: var(--stage); color: var(--ink); }
.fb { font-size: 0.9rem; }
.fb.ok { color: var(--ok); } .fb.hint { color: var(--warn); }
.q { margin-bottom: 12px; }
.q p { margin: 0 0 6px; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; font: 400 0.95rem var(--font-body); padding: 8px 12px; border-radius: 8px; border: 2px solid var(--rule); background: var(--stage); color: var(--ink); cursor: pointer; }
.opt.right { border-color: var(--ok); }
.opt.wrong { border-color: var(--warn); }
.done { background: var(--panel); border: 1px dashed var(--ok); border-radius: 10px; padding: 8px 12px; font-size: 0.95rem; }
.navrow { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.tiny { font-size: 0.82rem; color: var(--muted); }
.copyline { font-family: var(--font-num); font-size: 0.98rem; background: var(--panel); border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; user-select: all; overflow-wrap: anywhere; }
table.sum { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
table.sum td { border-bottom: 1px solid var(--rule); padding: 6px 4px; vertical-align: top; }
table.sum td.v { font-family: var(--font-num); text-align: right; white-space: nowrap; }
.loadmsg { margin: auto; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- Relay Lab additions ---- */
.lanes { display: flex; flex-direction: column; gap: 6px; }
table.lanetbl { border-collapse: collapse; width: 100%; font-size: 0.92rem; margin-top: 8px; }
table.lanetbl th { text-align: left; font-weight: 700; color: var(--muted); font-size: 0.8rem; border-bottom: 1px solid var(--rule); padding: 4px; }
table.lanetbl td { border-bottom: 1px solid var(--rule); padding: 5px 4px; }
table.lanetbl td.v { font-family: var(--font-num); text-align: right; white-space: nowrap; }
.sw2 { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.order { display: flex; flex-direction: column; gap: 6px; }
.order .slot { min-height: 38px; border: 2px dashed var(--rule); border-radius: 8px; padding: 7px 10px; font-size: 0.95rem; display: flex; gap: 8px; align-items: center; }
.order .slot.filled { border-style: solid; border-color: var(--ok); background: var(--stage); }
.order .slot b { font-family: var(--font-num); color: var(--muted); min-width: 1.3em; }
.pool { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pool .opt { flex: 1 1 14rem; }
.pool .opt.shake { border-color: var(--warn); }
.inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
.inputs label { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--stage); }
.inputs input { width: 22px; height: 22px; }
.tagE { color: var(--ok); } .tagI { color: var(--warn); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--stage); font-size: 0.95rem; }
.seg input { width: 18px; height: 18px; accent-color: var(--accent); }
.sub { margin: 10px 0 4px; font-weight: 700; font-size: 0.95rem; }
.gate { max-width: 34rem; }
.pwrow { display: flex; flex-direction: column; gap: 6px; }
.pwrow label { font-weight: 700; }
.pwrow .inrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pwrow input { font: 600 1.15rem var(--font-num); width: 12rem; max-width: 100%; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--rule); background: var(--stage); color: var(--ink); }
/* ---- Seeing Lab additions ---- */
.stagewrap { background: #F4F4F2; border-radius: 10px; border: 1px solid var(--rule); overflow: hidden; touch-action: manipulation; }
.stagewrap canvas { display: block; width: 100%; }
.cardbox { margin: 8px 0; border: 2px dashed var(--accent); border-radius: 10px; background: var(--stage); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); }
.bigbtn { font: 700 1.2rem var(--font-body); min-height: 64px; width: 100%; border-radius: 12px; border: 3px solid var(--accent); background: var(--panel); color: var(--accent); cursor: pointer; touch-action: manipulation; }
.bigbtn:active { background: var(--accent); color: var(--panel); }
.bench.wide { grid-template-columns: 1fr; }
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 8px; }
.swatch { min-height: 48px; border-radius: 10px; border: 2px solid var(--rule); font: 700 0.95rem var(--font-body); cursor: pointer; color: #1C2433; }
.swatch.none { background: var(--panel); color: var(--ink); }
.pill { display: inline-block; font: 600 0.85rem var(--font-num); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--stage); }
table.rt { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
table.rt th { text-align: left; font-weight: 700; color: var(--muted); font-size: 0.8rem; border-bottom: 1px solid var(--rule); padding: 4px; }
table.rt td { border-bottom: 1px solid var(--rule); padding: 6px 4px; }
table.rt td.v { font-family: var(--font-num); text-align: right; white-space: nowrap; }
.gate { max-width: 34rem; }
.pwrow { display: flex; flex-direction: column; gap: 6px; }
.pwrow label { font-weight: 700; }
.pwrow .inrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pwrow input { font: 600 1.15rem var(--font-num); width: 12rem; max-width: 100%; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--rule); background: var(--stage); color: var(--ink); }
</style></head><body>
<div class="app">
  <header class="topbar">
    <h1>Seeing Lab</h1>
    <span class="note">Introduction to Neuroscience · Sessions 13–14 · from light to perception · nothing is saved or sent</span>
  </header>
  <div id="jspsych-target"><p class="loadmsg">Loading the lab…</p></div>
</div>

<script src="lib/jspsych-7.3.4.min.js"></script>
<script src="lib/plugin-html-button-response-1.2.0.min.js"></script>
<script>
(function () {
  "use strict";
  var target = document.getElementById("jspsych-target");
  if (typeof initJsPsych !== "function" || typeof jsPsychHtmlButtonResponse === "undefined") {
    target.innerHTML = '<div class="read"><h2>The lab could not load</h2><p>Check your internet connection and reload this page.</p></div>';
    return;
  }
  var PT = jsPsychModule.ParameterType;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FAST = /[?&]fast=1/.test(location.search);   // for automated testing only: shortens waits

  /* ---------------- helpers ---------------- */
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function setupCanvas(cv, h) {
    var w = cv.parentElement.clientWidth, dpr = window.devicePixelRatio || 1;
    cv.style.height = h + "px"; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function erf(x) {   // Abramowitz and Stegun 7.1.26
    var s = x < 0 ? -1 : 1; x = Math.abs(x); var t = 1 / (1 + 0.3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x));
  }
  function Phi(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }
  /* plot frame with an x range that can start below zero */
  function axes(ctx, L, T, W, H, xMin, xMax, yMax, xTicks, yTicks, xLabel, yLabel, xFmt) {
    var X = function (v) { return L + (v - xMin) / (xMax - xMin) * W; }, Y = function (v) { return T + (1 - v / yMax) * H; };
    ctx.font = "12px " + css("--font-num"); ctx.fillStyle = css("--muted"); ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
    yTicks.forEach(function (v) { ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + W, Y(v)); ctx.stroke(); ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(String(v), L - 6, Y(v)); });
    xTicks.forEach(function (v) { ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillText(xFmt ? xFmt(v) : String(v), X(v), T + H + 4); });
    ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText(xLabel, L + W, T + H + 20);
    ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillText(yLabel, 4, T - 12);
    return { X: X, Y: Y };
  }

  /* =======================================================================
     PART 2 model · a retinal ganglion cell with a centre–surround receptive field
     (difference of Gaussians, as in Rodieck 1965 and Enroth-Cugell & Robson 1966).
       centre sigma 0.5°, surround sigma 1.5°, surround weight 0.85 of the centre.
       So the centre/surround border is about 1.15° from the middle and the best
       spot is about 2.4° across. Diffuse light drives the cell only weakly (15%).
     Firing: resting 15 spikes/s; 70 spikes/s per unit of drive while the light
     is on (never below 0); for 0.25 s after the light goes off, a rebound of
     half the size in the opposite direction (Kuffler's "off" discharge).
     Spikes are random (Poisson), so repeats differ: the lab averages 5 flashes.
     Cell A is ON-centre; Cell B is OFF-centre (same map, opposite sign).
     ======================================================================= */
  var RF = { sc: 0.5, ss: 1.5, ks: 0.85, base: 15, gain: 70, border: 1.15 };
  function diskW(sig, r) { return 1 - Math.exp(-r * r / (2 * sig * sig)); }   // share of a centred Gaussian inside radius r
  function drive(st) {
    var c = RF.sc, s = RF.ss, k = RF.ks;
    if (st.exp === "size") {
      if (st.whole) return st.pol * (1 - k);
      var r = st.size / 2; return st.pol * (diskW(c, r) - k * diskW(s, r));

      var ri = st.hole / 2, ro = 5;
      return st.pol * ((diskW(c, ro) - diskW(c, ri)) - k * (diskW(s, ro) - diskW(s, ri)));
    }

  var TR = { pre: 0.3, on: 1.0, post: 0.5, reb: 0.25 };
  function rateAt(t, d) {
    if (t < TR.pre) return RF.base;
    if (t < TR.pre + TR.on) return Math.max(0, RF.base + RF.gain * d);

    return out;
  }

  /* lab state (in memory only) */
  var LAB = { fields: {}, answers: {}, pxcm: null, dist: null, bs: null, p2: { size: {}, ring: {}, edge: {} }, match: null, after: {} };
  function resetLab() { LAB = { fields: {}, answers: {}, pxcm: LAB.pxcm, dist: LAB.dist, bs: null, p2: { size: {}, ring: {}, edge: {} }, match: null, after: {} }; }

  var PARTS = {
    1: {
      eyebrow: "Part 1 of 4 · slides: “The hole in your eye”",
      title: "Find your blind spot",
      glance: "Where the optic nerve leaves the eye there are no photoreceptors. You have a hole in your vision, and your brain hides it.",
      steps: ["<b>Size your screen</b> with a bank card or a ruler (Step A), and set how far your eyes are from the screen (Step B).",
              "<b>Cover your left eye.</b> Look only at the cross with your right eye. A dot drifts sideways: press <b>Changed!</b> (or Space) when it vanishes, and again when it comes back.",
              "Do both sweeps (out, then back in), then try the filling-in test."],
      fields: [
        { id: "c", label: "Centre of your blind spot (degrees from where you look)", unit: "°", check: function (v) { return checkMine(v, LAB.bs && bsCalc().centre, "about 12–15° from where you look"); } },
        { id: "w", label: "Width of your blind spot", unit: "°", check: function (v) { return checkMine(v, LAB.bs && bsCalc().width, "about 5.5° wide"); } }
      ],
      questions: [
        { id: "why", q: "Why is there a blind spot at all?", options: ["The ganglion-cell axons leave the eye there as the optic nerve, so there is no room for photoreceptors", "That is where the rods are packed most tightly", "The lens cannot focus light there"], correct: 0,
          explain: "The spot is called the optic disc. In vertebrate eyes the wiring sits in front of the photoreceptors, so it has to exit through the retina somewhere (Purves, Ch. 11)." },
        { id: "fill", q: "In the filling-in test, what did you see where the grey disc was?", options: ["Stripes: the pattern seemed to continue", "A dark hole", "The grey disc stayed", "I could not tell"], any: true,
          explain: "Most people see the stripes continue. The brain does not show you a hole; it fills it in from the surroundings (Ramachandran, 1992). Seeing something different is fine: filling-in varies." },
        { id: "daily", q: "Why don’t you notice the hole in everyday life?", options: ["The brain fills it in, and with both eyes open each eye covers the other’s blind spot", "Photoreceptors there are just slower", "The blind spot moves around too fast to notice"], correct: 0,
          explain: "Each blind spot sits on the outer (temporal) side of that eye’s view, so the two holes fall on different parts of the world. When Edme Mariotte described the blind spot in the 1660s, many expected the nerve’s exit to be the eye’s most sensitive point. It is blind." }
      ],
      done: "Both sweeps done (or example data used), two numbers checked, booklet page 4 filled in."
    },
    2: {
      eyebrow: "Part 2 of 4 · slides: “Kuffler’s cat”",
      title: "Record from a retinal ganglion cell",
      glance: "A ganglion cell answers to a small patch of the world. Light in the centre and light in the surround push it in opposite directions.",
      steps: ["You are recording one cell, as Stephen Kuffler did in the early 1950s. Each <b>Record</b> flashes the light 5 times. The raster shows each spike as a tick.",
              "<b>Spot size:</b> record Cell A with light spots from small to big, then the whole screen. Find the best size.",
              "<b>Ring:</b> light only the surround. <b>Edge:</b> slide a light/dark edge across the cell. Then work out what Cell B is."],
      fields: [
        { id: "best", label: "Best light-spot diameter for Cell A", unit: "°", target: 2.4, tol: 0.9, hintLow: "Bigger spots still fire it harder. Try a few sizes above that.", hintHigh: "Smaller spots fire it harder. Try a few sizes below that." },
        { id: "bestr", label: "Cell A’s firing to that best spot", unit: "spikes/s", target: 65, tol: 10 },
        { id: "whole", label: "Cell A’s firing when the whole screen lights up", unit: "spikes/s", target: 25.5, tol: 7 }
      ],
      questions: [
        { id: "diffuse", q: "Compare the whole screen with the best spot. What does Cell A mostly signal?", options: ["How much light there is overall", "Contrast: light here versus less light around it", "Colour"], correct: 1,
          explain: "Light on the surround cancels most of the centre. Kuffler’s ganglion cells were “poor at signalling diffuse illumination” and good at signalling contrast (Purves, Ch. 11)." },
        { id: "ring", q: "A ring of light on the surround only (hole about 2.5° across). Cell A…", options: ["fires hard while the ring is on", "goes quiet while the ring is on, then fires a burst when it goes off", "does not change at all"], correct: 1,

  /* blind-spot maths: average the two sweeps so reaction time cancels out */
  function bsCalc() {
    var b = LAB.bs; if (!b) return null;
    if (b.example) return { inner: b.inner, outer: b.outer, centre: r1((b.inner + b.outer) / 2), width: r1(b.outer - b.inner), example: true };
    var ins = [], outs = [];

    if (b.inw && b.inw.length === 2) { outs.push(b.inw[0]); ins.push(b.inw[1]); }

        var rows = COLS.map(function (C) {
          var a = LAB.after[C.id];
          return '<tr><td>' + C.name + ' disc</td><td class="v">' + (a ? NAME[a] + (a === "skipped" ? "" : "") : "–") + '</td><td class="v">' + NAME[C.expect] + '</td></tr>';
        }).join("");
        el.querySelector("#atab").innerHTML = '<table class="rt"><tr><th>Stared at</th><th style="text-align:right">You saw</th><th style="text-align:right">Many people see</th></tr>' + rows + '</table>';
      }
      NAME.skipped = "skipped";
      function setBtn() {
        var go = el.querySelector("#go");
        if (st.k >= COLS.length) { go.disabled = true; go.textContent = "All three done"; el.querySelector("#skip").style.display = "none"; return; }
        go.disabled = false; go.textContent = "Start: colour " + (st.k + 1) + " of 3";
      }
      function stopTimer() { if (st.timer) clearInterval(st.timer); st.timer = null; }
      el.querySelector("#go").addEventListener("click", function () {
        if (st.phase === "stare") return;
        st.phase = "stare"; st.left = 20; el.querySelector("#pick").style.display = "none"; this.disabled = true;
        draw(true); el.querySelector("#ar").textContent = "Look at the black dot. Keep your eyes still: " + st.left + " s";
        var tick = FAST ? 20 : 1000;
        st.timer = setInterval(function () {
          st.left--; draw(true);
          if (st.left > 0) { el.querySelector("#ar").textContent = "Look at the black dot. Keep your eyes still: " + st.left + " s"; return; }
          stopTimer(); st.phase = "pick"; draw(false);
          el.querySelector("#ar").textContent = "Now: keep looking at the dot.";
          el.querySelector("#pick").style.display = "";
        }, tick);
      });
      el.querySelectorAll("[data-sw]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (st.phase !== "pick") return;
          var C = COLS[st.k], id = b.getAttribute("data-sw"); LAB.after[C.id] = id;
          el.querySelector("#ar").textContent = (id === C.expect ? "Most people see that too. " : "Many people see " + NAME[C.expect].toLowerCase() + " after " + C.name.toLowerCase() + ", but afterimages vary. ") + "Blink and look away for a moment.";
          el.querySelector("#pick").style.display = "none"; st.phase = "ready"; st.k++; setBtn(); draw(false); table();
        });
      });
      el.querySelector("#skip").addEventListener("click", function () {
        stopTimer(); COLS.forEach(function (C) { if (!LAB.after[C.id]) LAB.after[C.id] = "skipped"; });
        st.k = COLS.length; st.phase = "ready"; el.querySelector("#pick").style.display = "none"; setBtn(); draw(false); table();
        el.querySelector("#ar").textContent = "The table shows what many people see. Notice the pairs: red with blue-green, yellow with blue.";
      });
      cleanup.push(stopTimer);
      draw(false); setBtn(); table();
      onResize(function () { draw(st.phase === "stare"); });
      wireFindings(el, P, part);
      el.querySelector("#next").addEventListener("click", function () { finish(); });
    }

    /* ---------- Free lab: choose a part ---------- */
    function buildFree() {
      el.innerHTML = '<div class="read"><span class="eyebrow">Free lab</span><h2>Go back to any part</h2><p>Make a prediction first, then test it. Ideas: does Cell B prefer the same spot size as Cell A, with a dark spot? Does a ring do the opposite to Cell B? Does your blind spot measure the same a second time?</p>' +
        '<div class="row"><button class="btn2" data-go="1">Part 1: blind spot</button><button class="btn2" data-go="2">Part 2: ganglion cell</button><button class="btn2" data-go="3">Part 3: same grey?</button><button class="btn2" data-go="4">Part 4: afterimages</button></div>' +
        '<div class="row"><button class="btn" id="next">Back to results</button></div></div>';
      el.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { finish({ part: "free", go: b.getAttribute("data-go") }); }); });
      el.querySelector("#next").addEventListener("click", function () { finish({ part: "free", go: "results" }); });
    }
  };

  /* ---------------- password gates ----------------
     Each part opens only with the password shown on its SEEING LAB slide, so the
     class moves together. To change them, edit the four words below and the
     matching \pwone ... \pwfour in the deck. Letter case and spaces are ignored.
     This paces the class; it is not security (the words are in the page). */
  var PASSWORDS = { "1": "lantern", "2": "pebble", "3": "harbour", "4": "violet" };
  var GATE_INFO = {
    "1": { title: "Find your blind spot", slide: "Seeing Lab, Part 1: the hole in your eye" },
    "2": { title: "Record from a retinal ganglion cell", slide: "Seeing Lab, Part 2: Kuffler’s cat" },
    "3": { title: "Your own lateral inhibition", slide: "Seeing Lab, Part 3: same grey?" },
    "4": { title: "Afterimages and opposite colours", slide: "Seeing Lab, Part 4: tire out your cones" }
  };
  var UNLOCK_KEY = "seeinglab-unlocked";
  function loadUnlocked() { try { return JSON.parse(sessionStorage.getItem(UNLOCK_KEY)) || {}; } catch (e) { return {}; } }
  var unlocked = loadUnlocked();
  function saveUnlocked() { try { sessionStorage.setItem(UNLOCK_KEY, JSON.stringify(unlocked)); } catch (e) {} }
  function norm(w) { return String(w || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function PwGate(jsPsych) { this.jsPsych = jsPsych; }
  PwGate.info = { name: "pw-gate", parameters: { part: { type: PT.STRING, default: "1" } } };
  PwGate.prototype.trial = function (el, trial) {
    var self = this, p = trial.part, G = GATE_INFO[p];
    try { window.scrollTo(0, 0); } catch (e) {}
    el.innerHTML = '<div class="read gate"><span class="eyebrow">Part ' + p + ' of 4 · locked</span>' +
      '<h2>' + G.title + '</h2>' +
      '<div class="calm">Wait for the slide <b>' + G.slide + '</b>. It shows the password for this part. While you wait, look at the slides, not ahead.</div>' +
      '<form class="pwrow" id="pwform" autocomplete="off"><label for="pw">Password from the slide</label>' +
      '<div class="inrow"><input id="pw" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="pwfb">' +
      '<button class="btn" type="submit">Unlock</button></div>' +
      '<div class="fb" id="pwfb" aria-live="polite"></div></form></div>';
    var inp = el.querySelector("#pw"), fb = el.querySelector("#pwfb"), tries = 0;
    try { inp.focus({ preventScroll: true }); } catch (e) {}
    el.querySelector("#pwform").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var w = norm(inp.value);
      if (!w) { fb.className = "fb hint"; fb.textContent = "Type the word shown on the slide."; return; }
      if (w === norm(PASSWORDS[p])) { unlocked[p] = true; saveUnlocked(); self.jsPsych.finishTrial({ gate: p, ok: true }); }
      else {
        tries++; fb.className = "fb hint";
        fb.textContent = tries < 3 ? "Not that one. Check the spelling on the slide." : "Still not it. Ask a neighbour or your teacher for the word on the slide.";
        inp.select();
      }
    });
  };
  function gated(p) { return { timeline: [{ type: PwGate, part: p }], conditional_function: function () { return !unlocked[p]; } }; }

  /* ---------------- pages ---------------- */
  var jsPsych = initJsPsych({ display_element: target });
  var welcome = {
    type: jsPsychHtmlButtonResponse,
    stimulus:
      '<div class="read"><span class="eyebrow">Sessions 13–14 · sensory systems and vision</span>' +
      '<h2>Seeing Lab: from light to perception</h2>' +
      '<p>Your eye does not send the brain a photograph. It sends a heavily edited summary. This lab lets you catch the editing in your own vision, and in a model cell. Use it beside the slides: each part matches a slide.</p>' +
      '<ol class="partlist"><li><b>The hole in your eye</b>: map your own blind spot, then watch your brain fill it in.</li>' +
      '<li><b>Kuffler’s cat</b>: record from a retinal ganglion cell and find what it likes.</li>' +
      '<li><b>Same grey?</b>: measure your own lateral inhibition.</li>' +
      '<li><b>Tire out your cones</b>: afterimages and opposite colours.</li></ol>' +
      '<div class="calm"><b>You need:</b> a bank card, ID card or ruler for Part 1. Each part takes about 6 to 8 minutes. Work alone or with a partner. <b>Nothing you do is saved or sent anywhere.</b></div>' +
      '<div class="calm">Parts 1 and 4 ask you to look steadily at one point. Nothing flashes. If that is uncomfortable, each part has an example or skip button.</div>' +
      '<div class="calm"><b>Each part is locked.</b> Its password appears on the matching slide, so we all move together. No rush: wait for the slide.</div></div>',
    choices: ["Continue"]
  };
  function partTrial(p) { return { type: SeeingLab, part: p }; }
  function resultsHTML() {
    var b = bsCalc(), F = LAB.fields, A = LAB.answers, M = LAB.match, AF = LAB.after;
    var nm = { bluegreen: "blue-green", pink: "pink-purple", blue: "blue", red: "red", yellow: "yellow", green: "green", none: "no colour", skipped: "skipped" };
    var f = function (k, u) { return F[k] == null ? "–" : F[k] + (u ? " " + u : ""); };
    var rows = [
      ["Blind spot (Part 1)" + (b && b.example ? ", example data" : ""), b ? b.inner + "° to " + b.outer + "°" : "–"],
      ["Centre · width", b ? b.centre + "° · " + b.width + "°" : "–"],
      ["Best spot for Cell A (Part 2)", f("2.best", "°")],
      ["Cell A: best spot · whole screen", (F["2.bestr"] == null ? "–" : F["2.bestr"]) + " · " + (F["2.whole"] == null ? "–" : F["2.whole"]) + " spikes/s"],
      ["Cell B is", A["2.cellb"] ? "OFF-centre" : "–"],
      ["Your grey illusion (Part 3)", M ? (M.illusion > 0 ? "+" : "") + M.illusion + " of 255" : "–"],
      ["Afterimages (Part 4): red · yellow · green", ["red", "yellow", "green"].map(function (k) { return AF[k] ? nm[AF[k]] : "–"; }).join(" · ")]
    ];
    var line = "blind spot " + (b ? b.centre + "°/" + b.width + "°" : "-") + " | best spot " + (F["2.best"] ?? "-") + "° | best/whole " + (F["2.bestr"] ?? "-") + "/" + (F["2.whole"] ?? "-") + " sp/s | illusion " + (M ? M.illusion : "-") +
      " | after " + ["red", "yellow", "green"].map(function (k) { return AF[k] ? nm[AF[k]] : "-"; }).join("/");
    return '<div class="read"><span class="eyebrow">Your results</span><h2>What you found</h2>' +
      '<p>Only the numbers you measured or checked appear here.</p><table class="sum">' + rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>'; }).join("") + '</table>' +
      '<p><b>One line for your booklet or notes:</b></p><div class="copyline" id="copyline">' + line + '</div>' +
      '<div class="row"><button class="btn2" id="copybtn">Copy line</button><button class="btn2" id="freebtn">Open the free lab</button><button class="btn2" id="againbtn">Start again</button></div>' +
      '<div class="calm"><b>The big picture.</b> Every sense turns energy into spikes, and edits on the way. Your retina has a hole the brain hides, cells that report contrast rather than light, neighbours that inhibit each other, and colour signals that work in opposing pairs and adapt. What you see is the brain’s best guess about the world, not a copy of it.</div></div>';
  }
  var results = {
    type: jsPsychHtmlButtonResponse, stimulus: function () { return resultsHTML(); }, choices: [],
    on_load: function () {
      try { window.scrollTo(0, 0); } catch (e) {}
      var cl = document.getElementById("copyline");
      document.getElementById("copybtn").addEventListener("click", function () {
        var txt = cl.textContent, b = this, ok = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy line"; }, 1500); };
        function sel() { var r = document.createRange(); r.selectNodeContents(cl); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: press Ctrl/Cmd+C"; }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, sel); else sel();
      });
      document.getElementById("freebtn").addEventListener("click", function () { jsPsych.finishTrial({ next: "free" }); });
      document.getElementById("againbtn").addEventListener("click", function () { jsPsych.finishTrial({ next: "again" }); });
    }
  };
  function lastData() { var d = jsPsych.data.get().values(); return d[d.length - 1] || {}; }
  var revisit = {
    timeline: [partTrial("free"), {
      timeline: [{ type: SeeingLab, part: function () { return lastData().go; } }],
      conditional_function: function () { var g = lastData().go; return g === "1" || g === "2" || g === "3" || g === "4"; }
    }],
    loop_function: function () { return lastData().go !== "results"; }
  };
  var resultsLoop = {
    timeline: [results, { timeline: [revisit], conditional_function: function () { return lastData().next === "free"; } }],
    loop_function: function () { return lastData().go === "results"; }
  };
  var main = {
    timeline: [gated("1"), partTrial("1"), gated("2"), partTrial("2"), gated("3"), partTrial("3"), gated("4"), partTrial("4"), resultsLoop],
    loop_function: function () { var again = lastData().next === "again"; if (again) resetLab(); return again; }
  };
  jsPsych.run([welcome, main]);
})();
</script>
</body></html>
